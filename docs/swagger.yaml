basePath: /
definitions:
  github_com_aborgesrodrigues_to-do-api_internal_common.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
    type: object
  github_com_aborgesrodrigues_to-do-api_internal_common.Login:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  github_com_aborgesrodrigues_to-do-api_internal_common.MessageResponse:
    properties:
      message:
        example: User Deleted
        type: string
    type: object
  github_com_aborgesrodrigues_to-do-api_internal_common.Task:
    properties:
      description:
        type: string
      id:
        type: string
      state:
        type: string
      user:
        $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
      user_id:
        type: string
    type: object
  github_com_aborgesrodrigues_to-do-api_internal_common.User:
    properties:
      id:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing users and their tasks.
  title: To-Do API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Public endpoint. Validates the username and password and returns
        the user data along with an access token and a refresh token.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Login'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Log in and get tokens
      tags:
      - auth
  /tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List all tasks
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Only the task owner can delete it.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.MessageResponse'
        "403":
          description: Task does not belong to the authenticated user
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Only the task owner can retrieve it.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
        "403":
          description: Task does not belong to the authenticated user
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get a task by ID
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Updates the task description and state. Only the task owner can
        update it.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
        "403":
          description: Task does not belong to the authenticated user
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
  /token:
    post:
      consumes:
      - application/json
      description: Creates a user and returns the user data along with an access token
        and a refresh token.
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.AuthResponse'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user and returns the user data along with an access token
        and a refresh token.
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.AuthResponse'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.MessageResponse'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.User'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
  /users/{id}/refresh_token:
    get:
      description: Issues a new access token and refresh token. The refresh token
        must be sent in the Authorization header.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.AuthResponse'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Refresh tokens
      tags:
      - auth
  /users/{id}/tasks:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List a user's tasks
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_aborgesrodrigues_to-do-api_internal_common.Task'
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a task for a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
