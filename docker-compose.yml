services:
  app:
    build:
      context: .
      dockerfile: ./dev/docker/local.Dockerfile
    labels:
      logging: "true"
    logging:
      driver: k8s-file
    ports:
      - 8080:8080
    env_file:
      - ./.env
    volumes:
      - .:/build/
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      localstack:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
  db:
    image: postgres:13-alpine3.18
    restart: always
    ports:
      - '5432:5432'
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    volumes:
      - ./dev/db/initial.sql:/docker-entrypoint-initdb.d/initial.sql
  filebeat:
    user: root
    image: docker.elastic.co/beats/filebeat:8.15.0
    command: filebeat -e -strict.perms=false
    security_opt:
      - label=disable
    volumes:
      - ./dev/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/containers/storage/overlay-containers:/var/lib/containers/storage/overlay-containers:ro
      - /run/podman/podman.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # development only
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://elasticsearch:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 9200:9200
  
  localstack:
    image: localstack/localstack:1.4.0
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./dev/localstack:/docker-entrypoint-initaws.d
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://prometheus:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://grafana:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

